{% extends 'base.html' %}

{% block title %}Cambiar Contraseña - Renovatia{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3" style="margin-top: 2rem;">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <div class="d-flex align-items-center">
                        <div class="text-primary rounded-circle p-2 me-3" style="background-color: rgba(124, 58, 237, 0.1);">
                            <i class="fa-solid fa-shield-halved fs-4" style="color: #7c3aed;"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold text-dark">Seguridad de la Cuenta</h4>
                            <p class="text-muted small mb-0">Actualiza tu credencial de acceso al sistema</p>
                        </div>
                    </div>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.cambiar_password') }}">
                        <div class="mb-4">
                            <label for="password_actual" class="form-label fw-semibold text-secondary small">Contraseña Actual (Temporal o vigente) <span class="text-danger">*</span></label>
                            <input type="password" class="form-control bg-light" id="password_actual" name="password_actual" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="nueva_password" class="form-label fw-semibold text-secondary small">Nueva Contraseña <span class="text-danger">*</span></label>
                            <input type="password" class="form-control bg-light" id="nueva_password" name="nueva_password" placeholder="Mínimo 8 caracteres" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmar_password" class="form-label fw-semibold text-secondary small">Confirmar Nueva Contraseña <span class="text-danger">*</span></label>
                            <input type="password" class="form-control bg-light" id="confirmar_password" name="confirmar_password" placeholder="Repita su nueva contraseña" required>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn text-white px-4" style="background-color: #7c3aed; border: none;">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
